global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "toy-service"
    metrics_path: '/metrics'
    static_configs:
      - targets: ["toy-service:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

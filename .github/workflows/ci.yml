name: Agentic SRE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests chromadb langgraph ollama

      - name: Run Reasoning Loop Tests
        run: python test_reasoning_loop.py

      - name: Run Remediation Tests
        run: python test_remediation.py
